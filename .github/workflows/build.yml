# SPDX-License-Identifier: GPL-3.0-only
# Wonderblue-OS: build the installable package (.fwsc) with JieLi's toolchain, the browser emulator, and run the
# simulator over the GENRE page. The package and the emulator are attached to the run as a download ("wnd-1").
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write                          # (the wonderblue-os branch: the package goes into install/ and a release)
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow fonttools
      - name: simulator (the GENRE page, a song, playing it)
        working-directory: source
        run: sh tests/run_host.sh tests/wb_tour.txt
      - name: emulator
        working-directory: source
        run: APP_VER=0.2 sh web/make_emulator.sh
      - name: JieLi toolchain and SDK files (cached)
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1
      - name: JieLi toolchain and SDK files
        run: |
          # gitee and JieLi's server reset connections now and then: retries with backoff; the cache keeps them
          retry() { for d in 0 5 15 30 60; do sleep $d; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh source/tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            # the tested release, AC79NN_SDK_V1.2.1 (tools/build.py checks the three files' SHA-256)
            retry git clone --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin \
              /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout d179b4484759423312073f5fbb232501aa491047
          fi
      - name: firmware package
        working-directory: source
        run: ./build.sh --release 0.2
      - uses: actions/upload-artifact@v4
        with:
          name: wnd-1
          path: |
            source/build/wnd-1-0.2.fwsc
            emulator/index.html
          if-no-files-found: error
      - name: publish the package (wonderblue-os only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/wonderblue-os'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the web installer (index.html) and the launchers take the newest install/wnd-1-*.fwsc that install/SHA256SUMS names
          F=wnd-1-0.2.fwsc
          cp source/build/$F install/$F
          grep -v ' wnd-1-' install/SHA256SUMS > /tmp/sums || true
          (cd install && sha256sum $F) >> /tmp/sums && mv /tmp/sums install/SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/$F install/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "install: $F from ${GITHUB_SHA::7} [skip ci]"
            git pull --rebase origin wonderblue-os && git push origin HEAD:wonderblue-os
          fi
          # and a release to download it from (replaced by every build of this branch)
          gh release view wonderblue-0.2 >/dev/null 2>&1 || gh release create wonderblue-0.2 --prerelease --target "$GITHUB_SHA" \
            --title "Wonderblue-OS 0.2 (beta, untested on hardware)" \
            --notes "Install: open the web installer (index.html on GitHub Pages) in Chrome or Edge with the FM-1 plugged in, or run INSTALL-*.  Go back: M-VAVE's M-UPGRADE puts the official firmware back."
          gh release upload wonderblue-0.2 "install/$F" --clobber
