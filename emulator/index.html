<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wonderblue-OS</title>
<meta name="description" content="Wonderblue-OS (WND-1): a genre tracker firmware for the M-VAVE FM-1, built on KAWA by Omnipotard, running in the browser.">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2334313b'/%3E%3Crect x='6' y='6' width='20' height='14' rx='2' fill='%23120c24'/%3E%3Crect x='9' y='10' width='4' height='6' fill='%23ff5fb4'/%3E%3Crect x='15' y='9' width='3' height='7' fill='%23ffb03a'/%3E%3Crect x='20' y='12' width='3' height='4' fill='%233ed8ff'/%3E%3Ccircle cx='10' cy='25' r='2.4' fill='%23FF5C5C'/%3E%3Ccircle cx='16' cy='25' r='2.4' fill='%23FFCC40'/%3E%3Ccircle cx='22' cy='25' r='2.4' fill='%235CE274'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: the FM-1 lies on a dark desk; its panel is laid out as the real one (left knobs, screen,
   right knobs and buttons, the keybed below) and restacks on a phone, the screen first. One dark look.
   Below it: the user's samples, the saved projects, the guide, a word from the author. */
:root {
  --desk: #121212;
  --desk-2: #1b1b1b;
  --desk-3: #232323;
  --body: #2c2c2c;
  --body-hi: #3a3a3a;
  --bezel: #09080c;
  --label: #b8b3aa;
  --ink: #f1ecfb;
  --muted: #8c8984;
  --text-2: #d9d3e6;
  --pink: #5a8cff;
  --amber: #f0a030;
  --cyan: #3cc9b6;
  --green: #7ef0a8;
  --led-off: #2a2731;
  --k1: #FF5C5C;
  --k2: #FFCC40;
  --k3: #5CE274;
  --k4: #54A4FF;
  --display: "Silkscreen", "Courier New", monospace;
  --text: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--desk); color: var(--ink); }
body { margin: 0; font-family: var(--text); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 40px; overflow-x: hidden; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
a { color: var(--cyan); }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---- the header, the beta */
header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 6vw, 46px); letter-spacing: 0.04em; margin: 0; line-height: 1; color: var(--ink); }
h1 span { color: var(--pink); }
.beta { font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; line-height: 1; color: #1a1026; background: var(--amber); border-radius: 999px; padding: 6px 10px 5px; white-space: nowrap; }
.tag { font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.langs { display: flex; gap: 4px; background: var(--desk-2); border-radius: 10px; padding: 3px; }
.langs button { appearance: none; border: 0; background: none; color: var(--muted); font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--pink); color: #1a1026; }
.note { display: flex; gap: 12px; align-items: flex-start; margin: 0; padding: 12px 16px; border-radius: 14px; color: #ece6f6; font-size: 14.5px;
  background: linear-gradient(90deg, rgba(255,176,58,.14), rgba(255,176,58,.04)); border: 1px solid rgba(255,176,58,.38); }
.note svg { flex: none; width: 22px; height: 22px; color: var(--amber); margin-top: 1px; }
.note b { color: var(--amber); }

/* ---- the device */
.device {
  position: relative;
  background: linear-gradient(170deg, var(--body-hi), var(--body) 38%, #2b2831);
  border-radius: 26px;
  padding: 26px 26px 22px;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.35);
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 330px;
  grid-template-areas: "left screen right" "keys keys keys";
  gap: 22px 26px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.zone-left { grid-area: left; display: flex; flex-direction: column; gap: 16px; }
.zone-screen { grid-area: screen; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.zone-right { grid-area: right; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.zone-keys { grid-area: keys; }
.knobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; }
.knobs.row { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 6px; }
.knob { --ring: #4b4756; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: ns-resize; touch-action: none; min-width: 0; border-radius: 12px; }
.knob .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--label); text-transform: uppercase; white-space: nowrap; }
.knob .fn { font-family: var(--mono); font-size: 10px; color: var(--amber); letter-spacing: 0.05em; min-height: 1.25em; text-align: center; line-height: 1.25; }
.knob .fn.live { color: var(--ring); min-height: 2.5em; max-width: 100%; white-space: pre-line; overflow-wrap: anywhere; font-weight: 600; }
.ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--ring); transition: box-shadow .15s, border-color .15s; }
.knob.col .ring { box-shadow: 0 0 10px -4px var(--ring), inset 0 0 6px -3px var(--ring); }
.knob.col .lbl { color: var(--ring); }
.knob.hot .ring { box-shadow: 0 0 18px 0 var(--ring), inset 0 0 8px -2px var(--ring); }
.cap {
  --a: 0deg;
  width: 54px; height: 54px; border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, #5b5765 0 44%, transparent 45%),
    repeating-conic-gradient(from 0deg, #23212a 0 6deg, #3c3944 6deg 12deg);
  box-shadow: 0 6px 10px rgba(0,0,0,.55), inset 0 2px 2px rgba(255,255,255,.12);
  position: relative;
  transform: rotate(var(--a));
  transition: transform .06s linear;
}
.cap::after { content: ""; position: absolute; left: 50%; top: 7px; width: 3px; height: 13px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
.knob:focus-visible { outline: none; }
.knob:focus-visible .ring { outline: 2px solid var(--cyan); outline-offset: 3px; }
.btn:focus-visible, .key:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

.btns { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 8px; align-items: start; }
.oct { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.btn {
  appearance: none; border: 0; cursor: pointer; color: var(--label); border-radius: 9px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; background: none;
  font: inherit; min-width: 0;
}
.btn .face {
  width: 100%; height: 30px; border-radius: 9px;
  background: linear-gradient(180deg, #2a2730, #1f1d24);
  box-shadow: 0 3px 0 #121016, inset 0 1px 0 rgba(255,255,255,.07);
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 600; font-size: 11px; letter-spacing: 0.06em; color: var(--label);
  transition: transform .04s, box-shadow .04s, background .12s, color .12s;
}
.btn .fn { font-family: var(--mono); font-size: 9.5px; color: var(--amber); letter-spacing: 0.03em; text-align: center; line-height: 1.2; margin-top: 2px; }
.btn .alt { font-family: var(--mono); font-size: 8.5px; color: var(--muted); letter-spacing: 0.02em; text-align: center; line-height: 1.15; }
.btn.on .face { box-shadow: 0 3px 0 #121016, 0 0 14px -2px var(--glow, var(--pink)), inset 0 0 0 1px var(--glow, var(--pink)); color: var(--ink); }
.btn.dim .face { color: #d6d0e3; box-shadow: 0 3px 0 #121016, inset 0 0 0 1px rgba(255,95,180,.28); }
.btn.down .face { transform: translateY(2px); box-shadow: 0 1px 0 #121016; }
.btn[data-id="12"] { --glow: #60ff96; }
.btn[data-id="13"] { --glow: #ff4060; }

.bezel {
  background: var(--bezel); border-radius: 18px; padding: 16px;
  box-shadow: inset 0 0 0 2px #000, 0 1px 0 rgba(255,255,255,.08);
  width: min(100%, 392px);
  position: relative;
}
.glass { position: relative; aspect-ratio: 1; width: 100%; border-radius: 6px; overflow: hidden; background: #120c24; }
.glass canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.glass::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.07), transparent 40%), repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px); }
.power {
  position: absolute; inset: 16px; border-radius: 6px; display: grid; place-items: center; align-content: center; gap: 14px;
  background: radial-gradient(circle at 50% 38%, #2b1d52, #120c24 70%); text-align: center; padding: 18px;
}
.power p { margin: 0; color: var(--label); font-size: 14px; max-width: 26ch; }
.power button {
  font-family: var(--display); font-size: 17px; letter-spacing: 0.06em; color: #1a1026; background: var(--pink);
  border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer; box-shadow: 0 4px 0 #a33274;
}
.power button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a33274; }
.power button:disabled { opacity: .7; cursor: progress; }
.power .err { color: var(--amber); font-size: 13px; }
.scrinfo { width: min(100%, 392px); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); min-height: 26px; }
.scrinfo .pg { --acc: var(--pink); color: var(--ink); background: #1f1b27; border-radius: 8px; padding: 3px 10px; border-left: 3px solid var(--acc); font-weight: 600; white-space: nowrap; }
.scrinfo .pg:empty { visibility: hidden; }
.scrinfo .trk { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* the keybed: 16 white keys, 11 black, F3 to G5 */
.keybed { position: relative; height: 150px; background: #24212a; border-radius: 16px; padding: 10px; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }
.keys { position: relative; height: 100%; }
.key { position: absolute; bottom: 0; border-radius: 10px; cursor: pointer; touch-action: none; display: flex; justify-content: center; }
.key.w { top: 52px; background: linear-gradient(180deg, #3d3945, #302d36); box-shadow: 0 3px 0 #17151b, inset 0 1px 0 rgba(255,255,255,.06); }
.key.b { top: 0; height: 64px; background: linear-gradient(180deg, #34313a, #29262e); box-shadow: 0 3px 0 #141217, inset 0 1px 0 rgba(255,255,255,.05); z-index: 2; }
.key::before { content: ""; position: absolute; top: 12px; width: 4px; height: 34%; border-radius: 3px; background: var(--led-off); transition: background .08s, box-shadow .08s; }
.key.w::before { top: 18px; }
.key.dim::before { background: #7a3c63; }
.key.on::before { background: var(--pink); box-shadow: 0 0 10px var(--pink); }
.key.down { filter: brightness(1.25); transform: translateY(2px); }
.key .kn { position: absolute; bottom: 6px; font-family: var(--mono); font-size: 9px; color: var(--muted); }

/* ---- panels: the samples, the projects */
.panel { background: var(--desk-2); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.panel h2, .guide h2 { font-family: var(--display); font-size: 16px; letter-spacing: 0.05em; margin: 0 0 10px; font-weight: 400; }
.panel p { margin: 0 0 8px; color: var(--text-2); font-size: 14.5px; max-width: 86ch; }
.samples h2 { color: var(--cyan); }
.slots { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.slot { position: relative; background: var(--desk-3); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; border: 1px dashed transparent; transition: border-color .12s, background .12s; }
body.dragging .slot { border-color: rgba(62,216,255,.45); }
.slot.over { border-color: var(--cyan); background: #262838; }
.slot .shead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.slot .sid { font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; color: var(--pink); }
.slot .smeta { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.slot .sname { font-family: var(--display); font-size: 15px; letter-spacing: 0.03em; color: var(--ink); overflow-wrap: anywhere; min-height: 1.5em; line-height: 1.5; }
.slot.empty .sname { color: var(--muted); }
.slot .sacts { display: grid; gap: 6px; }
.sbtn { appearance: none; border: 0; cursor: pointer; font: 600 12px/1.25 var(--mono); letter-spacing: 0.03em; color: var(--ink); background: #37314b; border-radius: 9px; padding: 8px 10px; text-align: center; display: block; width: 100%; transition: background .12s; }
.sbtn:hover { background: #443d5d; }
.sbtn.hot { background: var(--cyan); color: #0c1a22; }
.sbtn.hot:hover { background: #6fe3ff; }
.sbtn:disabled { opacity: .42; cursor: default; background: #37314b; color: var(--ink); }
label.sbtn:focus-within { outline: 2px solid var(--cyan); outline-offset: 2px; }
.slot progress { width: 100%; height: 6px; appearance: none; -webkit-appearance: none; border: 0; border-radius: 3px; background: #15111d; overflow: hidden; }
.slot progress::-webkit-progress-bar { background: #15111d; border-radius: 3px; }
.slot progress::-webkit-progress-value { background: var(--cyan); border-radius: 3px; }
.slot progress::-moz-progress-bar { background: var(--cyan); border-radius: 3px; }
.slot .smsg { font-size: 12.5px; color: #cfc8dc; line-height: 1.35; }
.slot .smsg:empty { display: none; }
.smsg.err, .pmsg.err { color: var(--amber); }
.smsg.ok, .pmsg.ok { color: var(--green); }
.midi-pick { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.midi-pick label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--label); min-width: 0; max-width: 100%; }
select { font: 13px var(--mono); background: var(--desk-3); color: var(--ink); border: 1px solid #4a4458; border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.projects h2 { color: var(--pink); }
.proj { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; justify-content: space-between; }
.proj > div:first-child { flex: 1 1 380px; min-width: 0; }
.proj .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.proj .sbtn { width: auto; padding: 9px 14px; }
.pmsg { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.pmsg:empty { display: none; }

/* ---- the guide */
.guide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.guide section { background: var(--desk-2); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.guide h2 { color: var(--pink); }
.guide section:nth-child(2) h2 { color: var(--amber); }
.guide section:nth-child(3) h2 { color: var(--cyan); }
.guide li { color: var(--text-2); font-size: 14.5px; }
.guide ul { margin: 0; padding-left: 18px; display: grid; gap: 7px; }
.guide b { color: var(--ink); }
kbd { font-family: var(--mono); font-size: 12px; background: #2f2a3b; border-radius: 5px; padding: 1px 6px; color: var(--ink); white-space: nowrap; }
.k1 { color: var(--k1); } .k2 { color: var(--k2); } .k3 { color: var(--k3); } .k4 { color: var(--k4); }

/* ---- a word from the author */
.donate {
  border-radius: 18px; padding: 22px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 28px;
  background: radial-gradient(circle at 8% 0%, rgba(255,95,180,.20), transparent 55%), radial-gradient(circle at 100% 100%, rgba(255,176,58,.18), transparent 50%), var(--desk-2);
  border: 1px solid rgba(255,176,58,.22);
}
.donate > div { flex: 1 1 320px; min-width: 0; }
.donate h2 { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: 0.04em; margin: 0 0 6px; color: var(--amber); }
.donate p { margin: 0; color: #ebe4f6; font-size: 15.5px; max-width: 56ch; }
.donate .sig { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.kofi { display: inline-flex; align-items: center; gap: 10px; background: var(--amber); color: #1a1026; font: 700 15.5px/1.2 var(--text); text-decoration: none; padding: 13px 22px; border-radius: 999px; box-shadow: 0 4px 0 #a5660c; transition: filter .12s; }
.kofi:hover { filter: brightness(1.07); }
.kofi:active { transform: translateY(2px); box-shadow: 0 2px 0 #a5660c; }
.kofi:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
.kofi svg { width: 24px; height: 24px; flex: none; }
.foot { color: var(--muted); font-size: 13.5px; max-width: 86ch; margin: 0; }

@media (max-width: 940px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "screen screen" "right right" "left left" "keys keys"; padding: 18px; }
  .zone-left { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: end; gap: 14px; }
  .zone-left .knobs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .guide { grid-template-columns: minmax(0, 1fr); }
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  body { padding-block: 14px 32px; }
  .device { padding: 14px; border-radius: 20px; gap: 16px; }
  .ring { width: 52px; height: 52px; }
  .cap { width: 42px; height: 42px; }
  .cap::after { top: 5px; height: 10px; }
  .knob .lbl { font-size: 9.5px; letter-spacing: 0.04em; }
  .knob .fn { font-size: 9.5px; }
  .btns { gap: 8px 5px; }
  .btn .face { font-size: 10px; height: 28px; }
  .btn .fn { font-size: 8.5px; letter-spacing: 0; }
  .btn .alt { font-size: 8px; letter-spacing: 0; }
  .zone-left { grid-template-columns: minmax(0, 1fr); }
  .keybed { height: 128px; padding: 6px; }
  .key.w { top: 44px; }
  .key.b { height: 54px; }
  .key .kn { display: none; }
  .panel, .guide section { padding: 16px; }
  .slots { gap: 10px; }
  .slot { padding: 10px; }
  .donate { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) { .cap, .btn .face, .key::before, .ring, .slot, .sbtn { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>WONDER<span>BLUE</span></h1>
      <span class="beta" id="beta-badge">0.1 BETA</span>
    </div>
    <div class="tag" data-t="tag"></div>
    <div class="langs" role="group" data-ta="langs" aria-label="Language">
      <button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="fr" lang="fr">FR</button><button type="button" data-lang="es" lang="es">ES</button>
    </div>
  </header>

  <p class="note" role="note">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4.5"/><path d="M12 17.4v.1"/></svg>
    <span data-t="beta"></span>
  </p>

  <div class="device" id="device" data-page="-1">
    <div class="zone-left">
      <div class="knobs" id="knobs-left"></div>
      <div class="oct" id="oct"></div>
    </div>
    <div class="zone-screen">
      <div class="bezel">
        <div class="glass"><canvas id="screen" width="240" height="240" role="img" data-ta="screen" aria-label="The FM-1's screen"></canvas></div>
        <div class="power" id="power">
          <p data-t="power"></p>
          <button id="power-btn" type="button" data-t="powerBtn"></button>
          <div class="err" id="power-err" role="alert" hidden></div>
        </div>
      </div>
      <div class="scrinfo" aria-live="polite"><span class="pg" id="pg-name"></span><span class="trk" id="trk-name"></span></div>
    </div>
    <div class="zone-right">
      <div class="knobs row" id="knobs-right"></div>

  class KawaEngine {
    constructor(bytes, rate, boot) {
      const x = this.ex = new WebAssembly.Instance(new WebAssembly.Module(bytes), {}).exports;
      x.kawa_init();
      this.buf = null; this.pos = 512; this.ratio = 44100 / rate; this.frac = 0;
      this.pl = 0; this.pr = 0; this.cl = 0; this.cr = 0;
      this.frames = 0; this.emit = function () {};
      this.sg = -1; this.ledKey = ""; this.uiKey = ""; this.slotKey = "";
      this.storeAt = -1e9; this.storeDue = false;
      boot = boot || {};
      if (boot.lang !== undefined) x.kawa_lang(boot.lang | 0);
      if (boot.store) this.putStore(boot.store);
      const s = boot.samples || [];
      for (let k = 0; k < s.length; k++) if (s[k]) this.putSample(k, s[k].data, s[k].name, s[k].rate);
      this.storeGen = x.kawa_store_gen();
    }
    u8(p, n) { return new Uint8Array(this.ex.memory.buffer, p, n); }
    str(p, max) {
      const u = new Uint8Array(this.ex.memory.buffer);
      let s = "";
      for (let i = 0; i < max && u[p + i]; i++) s += String.fromCharCode(u[p + i]);
      return s;
    }
    putStore(b) {                                /* the saved slots back in, then the autosave */
      const x = this.ex, n = x.kawa_store_size(), m = this.u8(x.kawa_store(), n);
      m.fill(0);
      m.set(b.length > n ? b.subarray(0, n) : b);
      x.kawa_store_loaded();
      this.storeGen = x.kawa_store_gen();
    }
    putSample(slot, data, name, rate) {          /* 8-bit mu-law into a user slot (MY 1..4) */
      const x = this.ex, cap = x.kawa_sample_size(), len = Math.min(cap, data.length);
      this.u8(x.kawa_sample_buf(), cap).set(data.subarray(0, len));
      const nm = this.u8(x.kawa_sample_name(), 16);
      nm.fill(0);
      for (let i = 0; i < 11 && i < name.length; i++) nm[i] = name.charCodeAt(i) & 0x7F;
      x.kawa_sample_commit(slot | 0, len, rate === 11025 ? 11025 : 22050);
      this.slotKey = "";

    sendStore(asked) {
      const x = this.ex, b = this.u8(x.kawa_store(), x.kawa_store_size()).slice();
      this.storeAt = this.frames; this.storeDue = false;
      this.emit({t: "store", data: b, asked: !!asked}, [b.buffer]);

      else if (d.t === "btn") x.kawa_button(d.id, d.down ? 1 : 0);
      else if (d.t === "turn") x.kawa_turn(d.enc, d.steps | 0);
      else if (d.t === "master") x.kawa_master(d.v | 0);
      else if (d.t === "midi") x.kawa_midi(d.st, d.d1, d.d2);

    constructor(o) {

      this.e.emit = (m, tr) => this.port.postMessage(m, tr || []);
      this.e.hello();
      this.t = 0; this.last = -1e9;
      this.port.onmessage = (ev) => this.e.msg(ev.data);
    }
    process(inputs, outputs) {
      const out = outputs[0];
      this.e.fill(out[0], out[1] || out[0]);
      this.t += out[0].length;
      if (this.t - this.last >= sampleRate / 30) { this.last = this.t; this.e.poll(); }
      return true;
    }
  }
  registerProcessor("kawa", KawaProc);`;

           "<li><b>SAVE</b>: new song, save, save as, load, rename, demo (<b>OCT+</b> OK, <b>OCT−</b> back); it blinks while there are unsaved changes. Hold SAVE for the tools: OPTIONS, UNDO, REDO, CLEAR, COPY, PASTE, RANDOM (SELECT picks one, it runs when you let go). SAVE held + OCT−: undo at once, + OCT+: redo. Undo covers the sounds too (knob turns, sends, factory sounds loaded): \"UNDONE: SOUND 3\", 10 steps.</li>" +
           "<li>Hold <b>HOME</b>, <b>FX</b> or <b>SAVE</b>: a yellow bar labelled HELP, LIVE or TOOLS fills at the bottom of the screen, and the help, the LIVE effects or the tools appear when it is full.</li>" +
           "<li><b>HOME</b> + <b>PLAY</b>: panic. The song stops, every voice and live effect is cut.</li>",
      g2: "Effects and magic",
      g2l: "<li><b>FX</b>: SENDS (a drive, an echo and a reverb for each track: ALGORITHM picks the track, KNOB 1–3 set the levels), again the LIVE effects, a third time back.</li>" +
           "<li>Hold <b>FX</b> and play the white keys: 32 live effects (<b>OCT+</b> the second bank), on the master or a track. Let go and you are back.</li>" +
           "<li><b>SCL</b> opens the scale, again the magic: chop the break, write a beat, a melody or a bassline in the scale, Euclid, rolls…</li>" +
           "<li><b>MIX</b> (ENV twice): the levels and the master effect. The black keys mute; ARP held + a black key: solo.</li>" +
           "<li>ARP held + SELECT: a row in or out; + ALGORITHM: in the whole pattern.</li>" +
           "<li><b>EDIT</b> again and again: SOUND, SOUND 2, (FM: OPERATOR, OP ENVELOPE; SAMPLE: SAMPLE EDIT), EFFECT, TABLE. <b>LFO</b>: the LFO, then MODULATION.</li>" +
           "<li>On SOUND, <b>PRESETS</b> changes a sound you have not touched at once. A sound you edited (marked *) is kept: the next factory sound is only shown in gold, with ? and OCT+. Keep turning to browse; <b>OCT+</b> loads it, <b>OCT−</b> keeps yours.</li>" +

      g1: "Les bases",
      g1l: "<li>Un tracker fait avant tout pour la chiptune et l'IDM (il sait faire d'autres styles aussi). Le temps descend : chaque ligne est un pas (une double croche), chaque colonne une piste, chaque case une note, son volume et un effet.</li>" +
           "<li>Après <b>ALLUMER</b>, appuie sur une touche : l'écran de démarrage t'attend. <b>PLAY</b> lance le morceau. KAWA démarre sur un morceau vide (un cadre sur PISTES dit quoi faire jusqu'à la première note) : la démo est dans <b>SAVE</b> › DÉMO. Six pistes, chacune avec son moteur : PULSE, WAVE, NOISE, FM (une piste, 6 opérateurs), KIT (8 kits) ou SAMPLE (les breaks ou tes propres sons).</li>" +
           "<li><b>ALGORITHM</b> choisit la piste, <b>SELECT</b> la ligne, <b>PRESETS</b> le motif. <b>KNOB 1 à 4</b> (<span class=\"k1\">rouge</span>, <span class=\"k2\">jaune</span>, <span class=\"k3\">vert</span>, <span class=\"k4\">bleu</span> sur toutes les pages) changent la case : leurs étiquettes disent ce qu'ils font.</li>" +
           "<li><b>REC</b> puis les touches : les notes s'écrivent au curseur (sur le temps pendant la lecture). REC tenu + SELECT : de combien de lignes saute une note. <b>ARP</b> est la touche d'effacement (pas un arpégiateur) : elle efface la case.</li>" +
           "<li><b>HOME</b> les pistes (tenu : l'aide de la page) · <b>SEQ</b> la grille (OCT− / OCT+ : 16, 32 ou 64 pas) · <b>EDIT</b> le son, encore pour la page suivante (ARP tenu + PRESETS choisit le moteur) · <b>LFO</b> le LFO, encore la MODULATION · <b>ENV</b> l'enveloppe, encore MIX · <b>GLO</b> la chaîne, encore le groove, puis les options (avec un métronome).</li>" +
           "<li><b>SAVE</b> : nouveau morceau, sauver, sauver sous, charger, renommer, démo (<b>OCT+</b> OK, <b>OCT−</b> retour) ; il clignote tant qu'il y a des changements pas sauvés. SAVE tenu : les outils OPTIONS, ANNULER, REFAIRE, EFFACER, COPIER, COLLER, HASARD (SELECT en choisit un, il s'exécute quand tu lâches). SAVE tenu + OCT− : annuler aussitôt, + OCT+ : refaire. Annuler marche aussi sur les sons (tours de potard, envois, sons d'usine chargés) : « ANNULE: SON 3 », 10 pas.</li>" +
           "<li>Tiens <b>HOME</b>, <b>FX</b> ou <b>SAVE</b> : une barre jaune marquée AIDE, LIVE ou OUTILS se remplit en bas de l'écran, et l'aide, les effets LIVE ou les outils apparaissent quand elle est pleine.</li>" +
           "<li><b>HOME</b> + <b>PLAY</b> : panique. Le morceau s'arrête, chaque voix et chaque effet live est coupé.</li>",
      g2: "Effets et magie",
      g2l: "<li><b>FX</b> : ENVOIS (une saturation, un écho et une reverb par piste : ALGORITHM choisit la piste, KNOB 1–3 règlent les niveaux), encore les effets LIVE, une troisième fois retour.</li>" +
           "<li>Garde <b>FX</b> enfoncé et joue les touches blanches : 32 effets live (<b>OCT+</b> la deuxième banque), sur le master ou une piste. Relâche et tu reviens.</li>" +
           "<li><b>SCL</b> ouvre la gamme, encore la magie : découper le break, écrire un beat, une mélodie ou une basse dans la gamme, Euclide, roulements…</li>" +
           "<li><b>MIX</b> (ENV deux fois) : les niveaux et l'effet master. Les touches noires coupent ; ARP tenu + touche noire : solo.</li>" +
           "<li>ARP tenu + SELECT : une ligne en plus ou en moins ; + ALGORITHM : dans tout le motif.</li>" +
           "<li><b>EDIT</b> encore et encore : SON, SON 2, (FM : OPÉRATEUR, ENV. OP ; SAMPLE : ÉDITER LE SAMPLE), EFFET, TABLE. <b>LFO</b> : le LFO, puis la MODULATION.</li>" +
           "<li>Sur SON, <b>PRESETS</b> change tout de suite un son pas touché. Un son modifié (marqué *) est gardé : le son d'usine suivant est seulement montré en doré, avec ? et OCT+. Continue de tourner pour parcourir ; <b>OCT+</b> le charge, <b>OCT−</b> garde le tien.</li>" +

      g3: "Au clavier",
      g3l: "<li>Notes : rangées <kbd>W X C V…</kbd> et <kbd>A Z E R…</kbd> (positions des touches, AZERTY ou QWERTY).</li>" +

      "tt.PRESETS": "PRESETS elige el sonido de fábrica en la primera página SONIDO (en un sonido editado, marcado con *, solo muestra el siguiente en dorado: OCT+ lo carga, OCT− conserva el tuyo) y el cursor en las demás páginas EDIT: operador, fila de tabla, corte. Elige el patrón en PISTAS, REJILLA, MAGIA, ESCALA y FX, el patrón de la entrada de la canción en CANCIÓN, el volumen del clic en OPCIONES. ARP mantenido + PRESETS: el motor siguiente o anterior.",
      "tt.ALGORITHM": "ALGORITHM elige la pista (MEZCLA llega hasta el master); en CANCIÓN la entrada de la canción, en GROOVE el paso, en OPCIONES el modo del metrónomo. ARP mantenido + ALGORITHM inserta o borra una fila en todo el patrón.",
      "tt.K": "KNOB {n} ({c}): lo que hace en esta página está escrito debajo y en la línea de abajo de la pantalla.",
      "tt.0": "OCT− baja la octava del teclado; en la REJILLA baja el patrón a 32 y luego a 16 pasos; en PROYECTOS vuelve atrás; en SONIDO, cuando un sonido de fábrica se muestra en dorado, conserva el tuyo; SAVE mantenido + OCT− deshace al instante (patrones y sonidos).",
      "tt.1": "OCT+ sube la octava del teclado; en la REJILLA sube el patrón a 32 y luego a 64 pasos (este patrón enlazado con el siguiente); en PROYECTOS es OK; en LIVE abre el segundo banco; en SONIDO, cuando un sonido de fábrica se muestra en dorado, lo carga; SAVE mantenido + OCT+ rehace al instante.",
      "tt.2": "FX: un toque corto abre ENVÍOS (saturación, eco y reverb de cada pista), un segundo toque los efectos LIVE, un tercero vuelve atrás; SELECT también pasa de uno a otro. Mantenido desde otra página, se llena una barra amarilla con el nombre LIVE y LIVE se muestra mientras lo mantienes: toca las teclas blancas para 32 efectos en vivo (OCT+ el segundo banco), en el master o en una pista. FX mantenido y una tecla enseguida: ese efecto suena sin esperar a la barra.",
      "tt.3": "SCL abre la escala: su tónica, sus notas y el bloqueo que mantiene las teclas dentro; púlsalo otra vez para la MAGIA (herramientas en las teclas blancas que trocean el break y escriben un ritmo, una melodía o un bajo en la escala), una tercera vez para PISTAS.",
      "tt.4": "ENV abre la envolvente de la pista; púlsalo otra vez (o gira SELECT) para MEZCLA (niveles y efecto master; teclas negras: silencio, ARP mantenido + tecla negra: solo).",
      "tt.5": "LFO abre el LFO de la pista; púlsalo otra vez (o gira SELECT) para la MODULACIÓN.",
      "tt.6": "EDIT abre el sonido de la pista; púlsalo otra vez (o gira SELECT) para la página siguiente: SONIDO 2, los operadores FM (o el editor de sample), EFECTO, TABLA. PRESETS elige el sonido de fábrica, ARP mantenido + PRESETS el motor.",
      "tt.7": "GLO abre la canción (patrones tocados N veces); púlsalo otra vez para el GROOVE y luego OPCIONES (SELECT también los recorre): tema, idioma, reloj MIDI, fuente y el metrónomo con su volumen.",
      "tt.8": "HOME muestra las pistas; mantenlo, se llena una barra amarilla con el nombre AYUDA, para la ayuda de la página en la que estás. HOME + PLAY: pánico, la canción se para y todo sonido se corta.",
      "tt.9": "SAVE abre el menú de proyectos (canción nueva, guardar, guardar como, cargar, renombrar, demo; OCT+ OK, OCT− atrás); parpadea mientras hay cambios sin guardar. Mantenlo, se llena una barra amarilla con el nombre HERRAM., para las herramientas: OPCIONES, DESHACER, REHACER, BORRAR, COPIAR, PEGAR, AZAR. SELECT elige una y se ejecuta al soltar; KNOB 3 elige la pista o todo el patrón. SAVE mantenido + OCT− deshace, + OCT+ rehace, al instante: 10 pasos, para los patrones y los sonidos (giros de potenciómetro, envíos, sonidos de fábrica cargados).",
      "tt.10": "ARP es la tecla de borrar / desplazar, no un arpegiador. Un toque borra: la celda en PISTAS, el paso que mantienes en la REJILLA, el paso de TABLA, el carril LIVE. Mantenido: + SELECT inserta o borra una fila (+ ALGORITHM en todo el patrón), + KNOB 3 / 4 ajusta el segundo efecto de la celda, + PRESETS en SONIDO elige el motor, + una tecla negra en MEZCLA hace solo. En CANCIÓN cambia BUCLE / CANCIÓN; en EDITAR SAMPLE iguala los cortes.",
      "tt.11": "SEQ abre la rejilla: 16 pasos de la pista en las 16 teclas blancas; SELECT pasa la página, OCT− / OCT+ fijan el patrón en 16, 32 o 64 pasos.",
      "tt.12": "PLAY arranca o para la canción. HOME + PLAY: pánico, todo se para y se calla.",
      "tt.13": "REC activa o desactiva la grabación: las teclas escriben en el cursor (a tiempo mientras suena); REC mantenido + SELECT ajusta cuántas filas salta una nota.",
      "s.h": "Tus samples",
      "s.how": "Suelta un sonido en una ranura (WAV, MP3, OGG, FLAC…) o elige un archivo. Se convierte en lo que guarda el FM-1: mono, 22 kHz, 8 bits, 1,66 s como mucho, sin el silencio del principio. Luego, en la página SONIDO de una pista (<b>EDIT</b>): motor <b>SAMPLE</b>, <b>FUENTE</b> = <b>MI 1…4</b> (o el preset MI SAMPLE 1…4 con <b>PRESETS</b>). Tus sonidos se quedan en este navegador.",
      "s.fm1": "<b>Enviar a mi FM-1</b> copia una ranura a tu FM-1 con KAWA 0.2 o posterior: un cable USB de datos, Chrome o Edge, y la reproducción parada.",

      "m.rc1": "El FM-1 rechazó la petición (argumentos incorrectos). Recarga esta página y vuelve a intentarlo.",

      "p.h": "Proyectos guardados",
      "p.how": "Lo que guardas en el emulador (<b>SAVE</b> y luego <b>OCT+</b>, o <kbd>Ctrl/⌘ S</kbd>) se queda en este navegador y vuelve al encender. Exporta un archivo .kawa para guardar una copia o pasarlo a otro ordenador.",
      "p.exp": "Exportar proyectos", "p.imp": "Importar proyectos",
      "p.saved": "Guardado en este navegador a las {t}.",
      "p.none": "Nada guardado todavía: en el emulador, SAVE y luego OCT+.",
      "p.bad": "Esto no es un archivo de proyectos KAWA.",
      "p.done": "Proyectos importados: el autoguardado está cargado, los demás están en SAVE › CARGAR.",
      "p.later": "Proyectos importados: estarán ahí al encender.",
      "p.full": "El almacenamiento del navegador está lleno: exporta tus proyectos para conservarlos.",
      "p.exported": "Exportado: {f}",
      g1: "Lo básico",
      g1l: "<li>Un tracker hecho ante todo para el chiptune y el IDM (sabe hacer otros estilos también). El tiempo baja: cada fila es un paso (una semicorchea), cada columna una pista, cada celda una nota, su volumen y un efecto.</li>" +
           "<li>Tras <b>ENCENDER</b>, pulsa una tecla: la pantalla de arranque te espera. <b>PLAY</b> toca la canción. KAWA arranca con una canción vacía (un recuadro en PISTAS dice qué hacer hasta la primera nota): la demo está en <b>SAVE</b> › DEMO. Seis pistas, cada una con su motor: PULSE, WAVE, NOISE, FM (una pista, 6 operadores), KIT (8 kits) o SAMPLE (los breaks o tus propios sonidos).</li>" +
           "<li><b>ALGORITHM</b> elige la pista, <b>SELECT</b> la fila, <b>PRESETS</b> el patrón. <b>KNOB 1 a 4</b> (<span class=\"k1\">rojo</span>, <span class=\"k2\">amarillo</span>, <span class=\"k3\">verde</span>, <span class=\"k4\">azul</span> en todas las páginas) cambian la celda: sus etiquetas dicen lo que hacen.</li>" +
           "<li><b>REC</b> y luego las teclas: las notas se escriben en el cursor (a tiempo mientras suena). REC mantenido + SELECT: cuántas filas salta una nota. <b>ARP</b> es la tecla de borrar (no un arpegiador): borra la celda.</li>" +
           "<li><b>HOME</b> las pistas (mantenido: la ayuda de la página) · <b>SEQ</b> la rejilla (OCT− / OCT+: 16, 32 o 64 pasos) · <b>EDIT</b> el sonido, otra vez para la página siguiente (ARP mantenido + PRESETS elige el motor) · <b>LFO</b> el LFO, otra vez la MODULACIÓN · <b>ENV</b> la envolvente, otra vez MEZCLA · <b>GLO</b> la canción, otra vez el groove, luego las opciones (con un metrónomo).</li>" +
           "<li><b>SAVE</b>: canción nueva, guardar, guardar como, cargar, renombrar, demo (<b>OCT+</b> OK, <b>OCT−</b> atrás); parpadea mientras hay cambios sin guardar. SAVE mantenido: las herramientas OPCIONES, DESHACER, REHACER, BORRAR, COPIAR, PEGAR, AZAR (SELECT elige una, se ejecuta al soltar). SAVE mantenido + OCT−: deshacer al instante, + OCT+: rehacer. Deshacer también cubre los sonidos (giros de potenciómetro, envíos, sonidos de fábrica cargados): «DESHECHO: SONIDO 3», 10 pasos.</li>" +
           "<li>Mantén <b>HOME</b>, <b>FX</b> o <b>SAVE</b>: una barra amarilla con el nombre AYUDA, LIVE o HERRAM. se llena en la parte de abajo de la pantalla, y la ayuda, los efectos LIVE o las herramientas aparecen cuando está llena.</li>" +
           "<li><b>HOME</b> + <b>PLAY</b>: pánico. La canción se para, cada voz y cada efecto en directo se corta.</li>",
      g2: "Efectos y magia",
      g2l: "<li><b>FX</b>: ENVÍOS (una saturación, un eco y una reverb por pista: ALGORITHM elige la pista, KNOB 1–3 ajustan los niveles), otra vez los efectos LIVE, una tercera vez atrás.</li>" +
           "<li>Mantén <b>FX</b> y toca las teclas blancas: 32 efectos en vivo (<b>OCT+</b> el segundo banco), en el master o en una pista. Suéltalo y vuelves.</li>" +
           "<li><b>SCL</b> abre la escala, otra vez la magia: trocear el break, escribir un ritmo, una melodía o un bajo en la escala, Euclides, redobles…</li>" +
           "<li><b>MEZCLA</b> (ENV dos veces): los niveles y el efecto master. Las teclas negras silencian; ARP mantenido + tecla negra: solo.</li>" +
           "<li>ARP mantenido + SELECT: una fila más o menos; + ALGORITHM: en todo el patrón.</li>" +
           "<li><b>EDIT</b> una y otra vez: SONIDO, SONIDO 2, (FM: OPERADOR, ENV. OP; SAMPLE: EDITAR SAMPLE), EFECTO, TABLA. <b>LFO</b>: el LFO, luego la MODULACIÓN.</li>" +
           "<li>En SONIDO, <b>PRESETS</b> cambia al instante un sonido sin tocar. Un sonido editado (marcado con *) se conserva: el sonido de fábrica siguiente solo se muestra en dorado, con ? y OCT+. Sigue girando para recorrerlos; <b>OCT+</b> lo carga, <b>OCT−</b> conserva el tuyo.</li>" +
           "<li>Dos efectos por celda: <b>ARP</b> mantenido + KNOB 3 y 4 ajustan el segundo. SAL salta a una fila, FIN termina el patrón.</li>",
      g3: "Con el teclado",
      g3l: "<li>Notas: las filas <kbd>Z X C V…</kbd> y <kbd>Q W E R…</kbd> (posiciones de las teclas, QWERTY o AZERTY).</li>" +
           "<li><kbd>Espacio</kbd> PLAY · <kbd>Intro</kbd> REC · <kbd>Mayús</kbd> mantenido FX · <kbd>Retroceso</kbd> ARP · <kbd>Esc</kbd> HOME · <kbd>-</kbd> <kbd>=</kbd> OCT− OCT+.</li>" +
           "<li><kbd>↑</kbd><kbd>↓</kbd> fila · <kbd>←</kbd><kbd>→</kbd> pista · <kbd>RePág</kbd><kbd>AvPág</kbd> patrón.</li>" +
           "<li><kbd>Ctrl/⌘ Z</kbd> deshacer · <kbd>Ctrl/⌘ Y</kbd> o <kbd>Ctrl/⌘ Mayús Z</kbd> rehacer · <kbd>Ctrl/⌘ S</kbd> guardar · <kbd>F1</kbd> o <kbd>?</kbd> mantenido: ayuda.</li>" +
           "<li>La rueda del ratón sobre un potenciómetro, o arrástralo arriba y abajo; las flechas cuando tiene el foco.</li>",
      "d.h": "¿Me invitas a una cerveza?",
      "d.p": "Si te gusta lo que hago, ¡piensa en apoyarme! ¡Cada pequeño gesto significa muchísimo!",
      "d.sig": "Omnipotard, quien hizo KAWA",
      "d.btn": "Invítame a una cerveza en Ko-fi",
      "d.new": " (abre una pestaña nueva)",
      foot: "KAWA es software libre (GPL-3.0), construido sobre Dinghy, Felucca y SLOOP, la plataforma abierta de la comunidad FM-1. Los breaks están totalmente sintetizados. El firmware se instala en el FM-1 por USB bajo tu propio riesgo: ten a mano el firmware oficial V15 y M-UPGRADE para volver atrás."
    }
  };
  const LANG_ID = {fr: 0, en: 1, es: 2};
  let lang = "en";
  const T = (k, v) => {
    let s = (I18N[lang] && k in I18N[lang]) ? I18N[lang][k] : (k in I18N.en ? I18N.en[k] : "");
    if (v && typeof s === "string") s = s.replace(/\{(\w+)\}/g, (m, n) => (n in v ? String(v[n]) : m));
    return s;
  };
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };

  const canvas = $("screen"), ctx2d = canvas.getContext("2d"), img = ctx2d.createImageData(240, 240);
  const device = $("device");
  let send = () => {};
  let audio = null, running = false;
  const ui = {page: -1, trk: 0, theme: 0, sgen: 0, labels: ["", "", "", ""], names: ["", "", "", ""], leds: null};

  function drawScreen(fb) {
    const d = img.data;
    for (let i = 0, j = 0; i < 57600; i++, j += 4) {
      const c = fb[i];
      d[j] = ((c >> 11) & 31) * 255 / 31; d[j + 1] = ((c >> 5) & 63) * 255 / 63; d[j + 2] = (c & 31) * 255 / 31; d[j + 3] = 255;
    }
    ctx2d.putImageData(img, 0, 0);
  }

  /* ---- the buttons: each one held by any number of hands (pointer, keys, shortcuts); it goes down
     with the first and up with the last */
  const btnEls = [], keyEls = [], knobEls = {};
  const holders = Array.from({length: 14}, () => new Set());
  function hold(id, src, on) {
    const h = holders[id], was = h.size > 0;
    if (on) h.add(src); else h.delete(src);
    const now = h.size > 0;
    if (now === was) return;
    if (btnEls[id]) btnEls[id].classList.toggle("down", now);
    send({t: "btn", id, down: now ? 1 : 0});
  }
  function releaseAll(prefix) {
    holders.forEach((h, id) => { [...h].forEach((s) => { if (!prefix || s.startsWith(prefix)) hold(id, s, false); }); });
  }
  async function tapA(id, ms) { hold(id, "seq", true); await sleep(ms || 60); hold(id, "seq", false); }
  function tap(id, ms) { const s = "tap" + Math.random(); hold(id, s, true); setTimeout(() => hold(id, s, false), ms || 60); }

  /* ---- the panel */
  const FN_KEY = {MASTER: "k.master", SELECT: "k.select", PRESETS: "k.presets", ALGORITHM: "k.algo"};
  let master = 0.72;
  function makeKnob(parent, label, enc) {
    const ki = ["K1", "K2", "K3", "K4"].indexOf(enc);
    const k = document.createElement("div");
    k.className = "knob" + (ki >= 0 ? " col" : "");
    k.tabIndex = 0;
    k.setAttribute("role", "slider");
    k.setAttribute("aria-label", label);
    k.dataset.enc = enc;
    if (ki >= 0) k.style.setProperty("--ring", KNOB_COL[ki]);
    k.innerHTML = '<span class="lbl" aria-hidden="true">' + label + '</span><div class="ring"><div class="cap"></div></div>' +
      (ki >= 0 ? '<span class="fn live" id="klab-' + ki + '" aria-hidden="true"></span>' : '<span class="fn" aria-hidden="true" data-t="' + FN_KEY[enc] + '"></span>');
    parent.appendChild(k);
    knobEls[enc] = k;
    const cap = k.querySelector(".cap");
    let angle = 0;
    const setMaster = () => {
      k.setAttribute("aria-valuemin", "0"); k.setAttribute("aria-valuemax", "100"); k.setAttribute("aria-valuenow", String(Math.round(master * 100)));
      cap.style.setProperty("--a", (-135 + master * 270) + "deg");
    };
    const turn = (steps) => {
      if (!steps) return;
      if (enc === "MASTER") {
        master = Math.min(1, Math.max(0, master + steps * 0.04));
        setMaster();
        send({t: "master", v: Math.round(master * master * 6000)});
        return;
      }
      angle += steps * 18;
      cap.style.setProperty("--a", angle + "deg");
      send({t: "turn", enc: ENC[enc], steps});
    };
    if (enc === "MASTER") setMaster();
    k.addEventListener("wheel", (e) => { e.preventDefault(); turn(e.deltaY < 0 ? 1 : -1); }, {passive: false});
    let dragY = null, acc = 0;
    k.addEventListener("pointerdown", (e) => { dragY = e.clientY; acc = 0; k.setPointerCapture(e.pointerId); });
    k.addEventListener("pointermove", (e) => {
      if (dragY === null) return;
      acc += dragY - e.clientY; dragY = e.clientY;
      while (acc >= 10) { turn(1); acc -= 10; }
      while (acc <= -10) { turn(-1); acc += 10; }
    });
    const end = () => { dragY = null; };
    k.addEventListener("pointerup", end); k.addEventListener("pointercancel", end);
    k.addEventListener("keydown", (e) => {
      const s = {ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 4, PageDown: -4}[e.key];
      if (s) { turn(s); e.preventDefault(); e.stopPropagation(); }
    });
  }
  const BTN_FN = ["b.oct", "b.oct", "b.fx", "b.scl", "b.env", "b.lfo", "b.edit", "b.glo", "b.home", "b.save", "b.arp", "b.seq", "b.play", "b.rec"];
  function makeBtn(parent, label, id) {
    const b = document.createElement("button");
    const fn = BTN_FN[id], alt = (fn + ".alt") in I18N.en;
    b.type = "button"; b.className = "btn"; b.dataset.id = id;
    b.innerHTML = '<span class="face">' + label + '</span><span class="fn" data-t="' + fn + '"></span>' + (alt ? '<span class="alt" data-t="' + fn + '.alt"></span>' : "");
    parent.appendChild(b);
    btnEls[id] = b;
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); hold(id, "ptr", true); });
    const up = () => hold(id, "ptr", false);
    b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("lostpointercapture", up);
    b.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.stopPropagation(); e.preventDefault(); hold(id, "focus", true); } });
    b.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") { e.stopPropagation(); hold(id, "focus", false); } });
    b.addEventListener("blur", () => hold(id, "focus", false));
  }

  [["MASTER", "MASTER"], ["SELECT", "SELECT"], ["PRESETS", "PRESETS"], ["ALGORITHM", "ALGORITHM"]].forEach(([l, e]) => makeKnob($("knobs-left"), l, e));
  [["KNOB 1", "K1"], ["KNOB 2", "K2"], ["KNOB 3", "K3"], ["KNOB 4", "K4"]].forEach(([l, e]) => makeKnob($("knobs-right"), l, e));
  makeBtn($("oct"), "OCT-", BTN.OCTD);
  makeBtn($("oct"), "OCT+", BTN.OCTU);
  [["FX", BTN.FX], ["SCL", BTN.SCL], ["ENV", BTN.ENV], ["LFO", BTN.LFO], ["EDIT", BTN.EDIT], ["GLO", BTN.GLO],
   ["HOME", BTN.HOME], ["SAVE", BTN.SAVE], ["ARP", BTN.ARP], ["SEQ", BTN.SEQ], ["PLAY", BTN.PLAY], ["REC", BTN.REC]]
    .forEach(([l, id]) => makeBtn($("btns"), l, id));

  /* keys: F3 .. G5 */
  const NAMES = ["F", "F#", "G", "G#", "A", "A#", "B", "C", "C#", "D", "D#", "E"];
  let keyMask = 0;
  const setKey = (k, on) => {
    const m = on ? (keyMask | (1 << k)) : (keyMask & ~(1 << k));

    if (ui.page === PG.PROJECTS) { await tapA(BTN.SAVE); await sleep(120); }

    await tapA(BTN.SAVE); await sleep(150);

  /* ---- bytes */

      const s = u8.subarray(o, Math.min(u8.length, o + SLOT));
      let n = s.length;
      while (n && !s[n - 1]) n--;
      parts.push(b64enc(s.subarray(0, n)));
    }
    return ls.set(LS_STORE, JSON.stringify({v: 1, size: u8.length, slot: SLOT, parts}));
  }
  function loadStore() {
    try {
      const j = JSON.parse(ls.get(LS_STORE) || "null");

      j.parts.forEach((p, k) => {

  }
  const hhmm = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  function projMsg(text, cls) { const m = $("prj-msg"); m.textContent = text; m.className = "pmsg" + (cls ? " " + cls : ""); }

    if (asked) { if (hasProject(u8)) download(u8); else projMsg(T("p.none")); }
    if (!hasProject(u8) && !ls.get(LS_STORE)) return;

  }

  /* ---- the user's samples: decoded, mono, 22050 Hz, the silence before it gone, normalised to 0.95,

  const samples = [null, null, null, null];
  const slotEls = [];
  function saveSamples() {
    return ls.set(LS_SMP, JSON.stringify(samples.map((s) => (s ? {n: s.name, r: s.rate, d: b64enc(s.data)} : null))));
  }
  function loadSamples() {
    try {
      const j = JSON.parse(ls.get(LS_SMP) || "null");
      if (!Array.isArray(j)) return;
      j.slice(0, 4).forEach((s, k) => {
        if (s && s.d) samples[k] = {name: String(s.n || "SAMPLE").slice(0, 11), rate: s.r === 11025 ? 11025 : RATE, data: b64dec(s.d)};
      });

  }
  function sampleName(file) {
    const s = String(file || "").replace(/\.[^.]*$/, "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase()
      .replace(/[^A-Z0-9 _\-.!+#]/g, " ").replace(/\s+/g, " ").trim().slice(0, 11).trim();

  function decodeFile(ab) {
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;

    });

    try { ctx = new OAC(1, 1, RATE); } catch (e) { return fallback(); }   /* (decoded straight at 22050 Hz) */
    return dec(ctx, ab.slice(0)).catch(fallback);

  function encodeSample(buf) {
    const sr = buf.sampleRate, n = buf.length, ch = buf.numberOfChannels, chans = [];
    for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));

    let start = 0;
    while (start < n && Math.abs(mono(start)) <= 0.003) start++;              /* the silence before it goes */
    if (start >= n) throw new Error("silent");

      const y = Math.sign(x) * Math.log1p(255 * Math.abs(x)) / L;

  const secs = (n, r) => { const s = (n / (r || RATE)).toFixed(2); return lang === "en" ? s : s.replace(".", ","); };
  function setSlotMsg(k, text, cls) { const m = slotEls[k].msg; m.textContent = text || ""; m.className = "smsg" + (cls ? " " + cls : ""); }

  }
  function buildSlots() {
    const ol = $("slots");

  /* drag and drop: on a slot, or anywhere (the first empty slot); a .kawa file: the projects */
  const hasFiles = (e) => e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0;
  let dragDepth = 0, overEl = null;
  const setOver = (el) => { if (overEl === el) return; if (overEl) overEl.classList.remove("over"); overEl = el; if (el) el.classList.add("over"); };

  window.addEventListener("dragenter", (e) => { if (!hasFiles(e)) return; dragDepth++; document.body.classList.add("dragging"); });
  window.addEventListener("dragleave", (e) => { if (hasFiles(e) && --dragDepth <= 0) endDrag(); });

    if (k < 0) k = 0;

  /* ---- "Send to my FM-1": Web MIDI with SysEx, firmware/src/kawa_sysex.c's protocol. Frames:
     F0 7D 4B 57 cmd pack7(args) F7, one request and one reply at a time */
  class KErr extends Error { constructor(key, vars, step) { super(key); this.key = key; this.vars = vars; this.step = step; } }
  function pack7(b) {
    const out = [];
    let acc = 0, nb = 0;
    for (let i = 0; i < b.length; i++) {
      acc |= b[i] << nb; nb += 8;
      while (nb >= 7) { out.push(acc & 0x7F); acc >>>= 7; nb -= 7; }
    }
    if (nb) out.push(acc & 0x7F);
    return out;
  }
  function unpack7(b) {
    const out = [];
    let acc = 0, nb = 0;
    for (let i = 0; i < b.length; i++) {
      acc |= (b[i] & 0x7F) << nb; nb += 7;
      if (nb >= 8) { out.push(acc & 0xFF); acc >>>= 8; nb -= 8; }
    }
    return new Uint8Array(out);
  }
  const CMD_NAME = {1: "INFO", 2: "BEGIN", 3: "WRITE", 4: "END", 5: "ERASE", 6: "LIST"};
  const sysexFrame = (cmd, args) => new Uint8Array([0xF0, 0x7D, 0x4B, 0x57, cmd].concat(pack7(args || []), [0xF7]));
  class Link {
    constructor(o, i) { this.o = o; this.i = i; this.wait = null; this.retried = false; this.h = (ev) => this.got(ev.data); i.addEventListener("midimessage", this.h); }
    async open() { await Promise.all([this.i.open ? this.i.open() : 0, this.o.open ? this.o.open() : 0]); }
    got(d) {
      const w = this.wait;
      if (!w || !d || d.length < 6 || d[0] !== 0xF0 || d[1] !== 0x7D || d[2] !== 0x4B || d[3] !== 0x57 || d[d.length - 1] !== 0xF7 || d[4] !== w.cmd) return;
      const body = unpack7(d.subarray(5, d.length - 1));
      if (!body.length || (w.match && !w.match(body))) return;   /* (a late reply to an earlier try) */
      this.wait = null;
      clearTimeout(w.timer);
      w.res(body);
    }
    once(cmd, frame, ms, match) {
      return new Promise((res, rej) => {
        this.wait = {cmd, match, res, timer: setTimeout(() => { this.wait = null; rej(new KErr("m.timeout", null, CMD_NAME[cmd])); }, ms)};
        try { this.o.send(frame); } catch (e) { clearTimeout(this.wait.timer); this.wait = null; rej(e); }
      });
    }
    async ask(cmd, args, ms, match) {                     /* one try again after a timeout */
      const f = sysexFrame(cmd, args);
      try { return await this.once(cmd, f, ms, match); }
      catch (e) { if (!(e instanceof KErr)) throw e; this.retried = true; return this.once(cmd, f, ms, match); }
    }
    close() { this.i.removeEventListener("midimessage", this.h); if (this.wait) clearTimeout(this.wait.timer); this.wait = null; }
  }
  function rcCheck(body, step) {
    if (body[0] === 0) return body;
    throw new KErr(body[0] >= 1 && body[0] <= 5 ? "m.rc" + body[0] : "m.rcX", {c: body[0]}, step);
  }
  function sampleHeader(data, rate, name) {          /* usr_hdr_t: magic, len, rate, name[12], crc, rsv[2] (36 B, LE) */
    const h = new Uint8Array(36), dv = new DataView(h.buffer);
    dv.setUint32(0, 0x504D534B, true);
    dv.setUint32(4, data.length, true);
    dv.setUint32(8, rate, true);
    for (let i = 0; i < 11 && i < name.length; i++) h[12 + i] = name.charCodeAt(i) & 0x7F;
    dv.setUint32(24, crc32(data), true);
    return h;
  }
  let midiAcc = null;
  const PORT_RE = /FM-1|Felucca|KAWA/i;
  function fillPicker(outs, ins, o, i) {
    const fill = (sel, list, pick) => {
      sel.textContent = "";
      list.forEach((p) => { const op = document.createElement("option"); op.value = p.id; op.textContent = p.name || p.id; sel.appendChild(op); });
      if (pick) sel.value = pick.id;
    };
    fill($("midi-out"), outs, o);
    fill($("midi-in"), ins, i);
    $("midi-pick").hidden = false;
  }
  function findPorts(acc) {
    const outs = [], ins = [];
    acc.outputs.forEach((p) => outs.push(p));
    acc.inputs.forEach((p) => ins.push(p));
    let o = null, i = null;
    if (!$("midi-pick").hidden) {
      o = outs.find((p) => p.id === $("midi-out").value) || null;
      i = ins.find((p) => p.id === $("midi-in").value) || null;
    }
    o = o || outs.find((p) => PORT_RE.test(p.name || "")) || null;
    i = i || ins.find((p) => PORT_RE.test(p.name || "")) || null;
    return {o, i, outs, ins};
  }
  async function sendSlot(k) {
    const s = samples[k];
    if (!s || sending >= 0) return;
    sending = k;
    renderSlots();
    const el = slotEls[k];
    let link = null;
    try {
      if (!navigator.requestMIDIAccess) throw new KErr("m.nomidi");
      setSlotMsg(k, T("m.search"));
      if (!midiAcc) {
        try { midiAcc = await navigator.requestMIDIAccess({sysex: true}); } catch (e) { throw new KErr("m.denied"); }
      }
      const p = findPorts(midiAcc);
      if (!p.o || !p.i) {
        if (!p.outs.length || !p.ins.length) throw new KErr("m.noports");
        fillPicker(p.outs, p.ins, p.o, p.i);
        throw new KErr("m.choose");
      }
      link = new Link(p.o, p.i);
      await link.open();
      const info = await link.ask(1, [], 1000);
      if (info[0] !== 0 || info.length < 5 || String.fromCharCode(info[1], info[2], info[3], info[4]) !== "KAWA") throw new KErr("m.notkawa");
      const cap = info.length >= 13 ? info[10] | info[11] << 8 | info[12] << 16 : 0;
      if (cap && s.data.length > cap) throw new KErr("m.toobig");
      rcCheck(await link.ask(2, [k], 3000), "BEGIN");     /* (it erases: a longer wait) */
      el.bar.hidden = false; el.bar.value = 0;
      const n = s.data.length;
      for (let off = 0; off < n; off += 256) {
        const chunk = s.data.subarray(off, Math.min(n, off + 256));
        const args = new Uint8Array(4 + chunk.length);
        args[0] = k; args[1] = off & 0xFF; args[2] = (off >> 8) & 0xFF; args[3] = (off >> 16) & 0xFF;
        args.set(chunk, 4);
        rcCheck(await link.ask(3, args, 1000, (b) => b[1] === k && b[2] === args[1] && b[3] === args[2] && b[4] === args[3]), "WRITE");
        const pc = Math.round((off + chunk.length) * 100 / n);
        el.bar.value = pc;
        setSlotMsg(k, T("m.sending", {p: pc}));
      }
      const hdr = sampleHeader(s.data, s.rate, s.name), args = new Uint8Array(1 + hdr.length);
      args[0] = k; args.set(hdr, 1);
      link.retried = false;
      const end = await link.ask(4, args, 3000);
      if (end[0] === 5 && link.retried) {                 /* the first END may have been taken: the slot says */
        const l = await link.ask(6, [], 1000), q = l.subarray(1 + 18 * k, 19 + 18 * k);
        if (!(l[0] === 0 && q.length === 18 && q[0] === 1 && (q[3] | q[4] << 8 | q[5] << 16) === n)) rcCheck(end, "END");
      } else rcCheck(end, "END");
      el.bar.value = 100;
      setSlotMsg(k, T("m.done", {n: s.name, k: k + 1}), "ok");
    } catch (e) {
      if (e instanceof KErr) setSlotMsg(k, T(e.key, e.vars) + (e.step && e.key !== "m.rc2" ? " [" + e.step + "]" : ""), "err");
      else { setSlotMsg(k, T("m.timeout") + " (" + (e && e.message ? e.message : e) + ")", "err"); console.warn("sysex:", e); }
      el.bar.hidden = true;
    } finally {
      if (link) link.close();
      sending = -1;
      renderSlots();
    }
  }

  /* ---- the languages */
  function applyLang(l) {
    if (!I18N[l]) l = "en";
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = T(el.dataset.t); });
    document.querySelectorAll("[data-ta]").forEach((el) => el.setAttribute("aria-label", T(el.dataset.ta)));
    document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === l ? "true" : "false"));
    ["MASTER", "SELECT", "PRESETS", "ALGORITHM"].forEach((e) => {
      knobEls[e].title = T("tt." + e);
      if (e !== "MASTER") knobEls[e].setAttribute("aria-valuetext", T(FN_KEY[e]));
    });
    for (let i = 0; i < 4; i++) knobEls["K" + (i + 1)].title = T("tt.K", {n: i + 1, c: T("colours")[i]});
    btnEls.forEach((b, id) => { b.title = T("tt." + id); });
    try { localStorage.setItem(LS_LANG, l); } catch (e) {}
    send({t: "lang", v: LANG_ID[l]});
    renderUi();
    renderSlots();
  }
  function firstLang() {
    const h = (location.hash || "").slice(1).toLowerCase();
    if (I18N[h]) return h;
    const s = ls.get(LS_LANG);
    if (I18N[s]) return s;
    return "en";                                /* English first, whatever the browser's language */
  }
  buildSlots();
  loadSamples();
  document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.lang)));
  applyLang(firstLang());
  if (loadStore() && hasProject(loadStore())) projMsg("");

  /* ---- power on: the saved projects and the samples go in before the first step */
  function wasmBytes() {
    const bin = atob(WASM_B64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function bootData() {
    return {
      lang: LANG_ID[lang],
      store: loadStore(),
      samples: samples.map((s) => (s ? {data: s.data.slice(), name: s.name, rate: s.rate} : null))
    };
  }
  function mainThreadEngine(wasm) {                  /* older browsers: the engine on the page itself */
    const Engine = new Function(ENGINE_SRC + "; return KawaEngine;")();
    const eng = new Engine(wasm, audio.sampleRate, bootData());
    eng.emit = (m) => onEngine(m);
    eng.hello();
    const sp = audio.createScriptProcessor(1024, 0, 2);
    sp.onaudioprocess = (ev) => eng.fill(ev.outputBuffer.getChannelData(0), ev.outputBuffer.getChannelData(1));
    sp.connect(audio.destination);
    send = (m) => eng.msg(m);
    let last = 0;
    const loop = (t) => { if (t - last >= 30) { last = t; eng.poll(); } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  async function powerOn() {
    const btn = $("power-btn"), err = $("power-err");
    btn.disabled = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      audio = new AC({sampleRate: 44100, latencyHint: "interactive"});
      const wasm = wasmBytes();
      let ok = false;
      if (audio.audioWorklet && window.AudioWorkletNode) {
        try {
          const url = URL.createObjectURL(new Blob([WORKLET_SRC], {type: "application/javascript"}));
          await audio.audioWorklet.addModule(url);
          const node = new AudioWorkletNode(audio, "kawa", {numberOfInputs: 0, outputChannelCount: [2], processorOptions: {bytes: wasm, boot: bootData()}});
          node.port.onmessage = (ev) => onEngine(ev.data);
          node.onprocessorerror = (ev) => { console.error("KAWA engine stopped", ev); err.hidden = false; err.textContent = T("err"); $("power").hidden = false; };
          node.connect(audio.destination);
          send = (m) => node.port.postMessage(m);
          ok = true;
        } catch (e) { console.warn("worklet:", e); }
      }
      if (!ok) mainThreadEngine(wasm);
      running = true;
      device.dataset.running = "1";
      send({t: "master", v: Math.round(master * master * 6000)});
      send({t: "lang", v: LANG_ID[lang]});
      $("power").hidden = true;
      audio.resume().catch(() => {});
      renderSlots();
      if (navigator.requestMIDIAccess) {          /* a MIDI keyboard plays the track under the cursor */
        navigator.requestMIDIAccess().then((m) => {
          const hook = (i) => { i.onmidimessage = (ev) => { const [st, d1, d2] = ev.data; if (st >= 0x80 && st < 0xA0) send({t: "midi", st, d1, d2: d2 || 0}); }; };
          m.inputs.forEach(hook);
          m.onstatechange = (ev) => { if (ev.port.type === "input" && ev.port.state === "connected") hook(ev.port); };
        }).catch(() => {});
      }
    } catch (e) {
      btn.disabled = false;
      err.hidden = false;
      err.textContent = T("err");
      console.error(e);
    }
  }
  $("power-btn").addEventListener("click", powerOn);

  /* a still of the boot screen before power-on */
  ctx2d.fillStyle = "#120c24";
  ctx2d.fillRect(0, 0, 240, 240);
})();
</script>
